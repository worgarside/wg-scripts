---
name: Pre-Commit Auto-Update

on:
  schedule:
    - cron: 0 1 * * *

  workflow_dispatch:

concurrency:
  group: prek-autoupdate
  cancel-in-progress: false

jobs:
  prek-autoupdate:
    name: Update Prek Hooks
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: chore/prek-autoupdate
    steps:
      - name: Clone Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Reset ${{ env.BRANCH }} from main
        run: |
          git fetch origin main
          git checkout -B "${BRANCH}" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install prek
        run: |
          uv tool install prek
          uv tool bin-dir >> "$GITHUB_PATH"

      - name: prek auto-update
        id: update
        run: prek auto-update --cooldown-days 3 > /tmp/output 2>&1

      - name: Commit Changes
        id: commit
        run: |
          if [[ -z "$(git status -s)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config --global user.name "worgarside-dev"
          git config --global user.email "worgarside.dev@gmail.com"

          git add .

          git commit -m "ci: prek autoupdate" --no-verify

          git push --force-with-lease origin "${BRANCH}"

          echo "pr=true" >> "${GITHUB_OUTPUT}"

      - name: Ensure Pull Request
        # yamllint disable-line rule:line-length
        if: steps.commit.outputs.pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          PR_TITLE: 'ci: 🤖 `prek autoupdate`'
        run: |
          existing="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "${existing}" ]]; then
            echo "Open PR #${existing} already exists for ${BRANCH}"
            exit 0
          fi

          PR=$(
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${PR_TITLE}" \
              -F /tmp/output \
              --base main \
              --head "${BRANCH}" \
              --label tools
          )

          GH_TOKEN=${{ secrets.WORGARSIDE_TOKEN }} gh pr merge \
            "${PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --auto
