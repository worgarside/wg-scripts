---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/wg_scripts/__init__.py'

  workflow_dispatch:
    inputs:
      force-deployment:
        description: >-
          Version component to force, prerelease to increment the prerelease
          revision, or auto to use semantic commit parsing.
        required: true
        type: choice
        options:
          - auto
          - prerelease
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: semantic-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  release:
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log Inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n$INPUTS\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python Semantic Release
        id: python-semantic-release
        # yamllint disable-line rule:line-length
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.WORGARSIDE_TOKEN }}
          git_committer_name: worgarside
          git_committer_email: worgarside@gmail.com
          config_file: pyproject.toml
          verbosity: 2
          force: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}
