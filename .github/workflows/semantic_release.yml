---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/wg_scripts/__init__.py'

  workflow_dispatch:
    inputs:
      publish-tag:
        description: The tag to deploy. Will attempt a new release if omitted.
        required: false
      force-deployment:
        description: >-
          Version component to force, prerelease to increment the prerelease
          revision, or auto to use semantic commit parsing.
        required: true
        type: choice
        options:
          - auto
          - prerelease
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: semantic-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  release:
    name: Release
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log Inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n$INPUTS\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python Semantic Release
        id: python-semantic-release
        # yamllint disable-line rule:line-length
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.WORGARSIDE_DEV_TOKEN }}
          git_committer_name: worgarside-dev
          git_committer_email: worgarside.dev@gmail.com
          config_file: pyproject.toml
          verbosity: 2
          force: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true' || inputs.publish-tag != ''
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        # yamllint disable-line rule:line-length
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Pis
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.publish-tag }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          WG_SCRIPTS_HOSTS: ${{ vars.WG_SCRIPTS_HOSTS }}
        run: |
          set -uo pipefail

          INSTALL_DIR="/home/${DEPLOY_SSH_USER}/wg-scripts"
          IFS=',' read -ra HOSTS <<< "${WG_SCRIPTS_HOSTS}"

          ok=0
          failed=0
          {
            echo "## Deploy \`${TAG}\`"
            echo ""
            echo "| Host | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for host in "${HOSTS[@]}"; do
            host="$(echo "$host" | xargs)"
            if [[ -z "$host" ]]; then
              continue
            fi

            echo "::group::Deploy ${TAG} → ${host}"
            if ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${DEPLOY_SSH_USER}@${host}" \
              "cd ${INSTALL_DIR} && just deploy ${TAG}"; then
              echo "OK: ${host}"
              echo "| \`${host}\` | OK |" >> "$GITHUB_STEP_SUMMARY"
              ok=$((ok + 1))
            else
              echo "::warning::Failed to deploy ${TAG} to ${host}"
              echo "| \`${host}\` | failed |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo ""
            echo "Succeeded: ${ok} / $((ok + failed))"
            echo "Failed: ${failed} / $((ok + failed))"
          } >> "$GITHUB_STEP_SUMMARY"

          # Soft-fail: unreachable Pis must not fail the release deploy job.
          exit 0
