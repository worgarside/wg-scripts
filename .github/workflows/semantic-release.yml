---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - '!src/wg_scripts/__init__.py'

  workflow_dispatch:
    inputs:
      publish-tag:
        description: The tag to deploy. Will attempt a new release if omitted.
        required: false
      force-deployment:
        description: >-
          Version component to force, prerelease to increment the prerelease
          revision, or auto to use semantic commit parsing.
        required: true
        type: choice
        options:
          - auto
          - prerelease
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: semantic-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  release:
    name: Release
    # Skip when redeploying an existing tag; do not cut a new release.
    if: inputs.publish-tag == ''
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      released: ${{ steps.python-semantic-release.outputs.released }}
      tag: ${{ steps.python-semantic-release.outputs.tag }}
      version: ${{ steps.python-semantic-release.outputs.version }}
    steps:
      - name: Log Inputs
        if: runner.debug == '1'
        env:
          INPUTS: ${{ toJson(inputs) }}
        run: echo -e "\`\`\`json\n$INPUTS\n\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          # Deploy key pushes to main (ruleset bypass). Do not use the
          # worgarside-dev PAT here — that would either fail rulesets or
          # require a full bypass that also skips checks on auto-merge.
          persist-credentials: false

      - name: Configure release deploy key
        env:
          SEMANTIC_RELEASE_DEPLOY_KEY: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
        # yamllint disable rule:line-length
        run: |
          # Key must live inside the workspace: the PSR action is Docker-based
          # and only mounts this directory (runner ~/.ssh is invisible to it).
          # Use relative paths so the same core.sshCommand works on the runner
          # (/home/runner/work/...) and inside the container (/github/workspace).
          install -m 700 -d .git/ssh
          printf '%s\n' "$SEMANTIC_RELEASE_DEPLOY_KEY" > .git/ssh/deploy_key
          chmod 600 .git/ssh/deploy_key
          ssh-keyscan -t ed25519,rsa github.com > .git/ssh/known_hosts
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config --local core.sshCommand "ssh -i .git/ssh/deploy_key -o UserKnownHostsFile=.git/ssh/known_hosts -o IdentitiesOnly=yes"
          git ls-remote --heads origin main
        # yamllint enable rule:line-length

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python Semantic Release
        id: python-semantic-release
        # yamllint disable-line rule:line-length
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          # API only (create GitHub Release). Git push uses the deploy key via
          # ignore_token_for_push in pyproject.toml.
          github_token: ${{ github.token }}
          git_committer_name: worgarside
          git_committer_email: worgarside@gmail.com
          config_file: pyproject.toml
          verbosity: 2
          force: ${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}

  deploy:
    name: Deploy
    needs: release
    # always(): release is skipped on publish-tag redeploys; without this,
    # needs: release would skip deploy too.
    if: >-
      always() && !cancelled() &&
      (needs.release.outputs.released == 'true' || inputs.publish-tag != '')
    environment: production-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        # yamllint disable-line rule:line-length
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Pis
        env:
          TAG: ${{ inputs.publish-tag || needs.release.outputs.tag }}
          # Default SSH user when a host entry has no user@ prefix.
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          WG_SCRIPTS_HOSTS: ${{ vars.WG_SCRIPTS_HOSTS }}
          # Optional: e.g. tag:pi — when set, discover online peers with this
          # tag instead of using WG_SCRIPTS_HOSTS.
          WG_SCRIPTS_TS_TAG: ${{ vars.WG_SCRIPTS_TS_TAG }}
        run: |
          set -uo pipefail

          if [[ -n "${WG_SCRIPTS_TS_TAG:-}" ]]; then
            echo "Discovering hosts with Tailscale tag ${WG_SCRIPTS_TS_TAG}"
            mapfile -t HOSTS < <(
              tailscale status --json | jq -r --arg tag "$WG_SCRIPTS_TS_TAG" '
                .Peer[]
                | select(.Online == true)
                | select((.Tags // []) | index($tag) != null)
                | .HostName
              ' | sort -u
            )
          else
            IFS=',' read -ra HOSTS <<< "${WG_SCRIPTS_HOSTS}"
          fi

          if [[ ${#HOSTS[@]} -eq 0 ]]; then
            echo "::error::No deploy hosts found (set WG_SCRIPTS_TS_TAG or WG_SCRIPTS_HOSTS)"
            exit 1
          fi

          ok=0
          failed=0
          {
            echo "## Deploy \`${TAG}\`"
            echo ""
            echo "| Host | User | Result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in "${HOSTS[@]}"; do
            entry="$(echo "$entry" | xargs)"
            if [[ -z "$entry" ]]; then
              continue
            fi

            if [[ "$entry" == *@* ]]; then
              user="${entry%%@*}"
              host="${entry#*@}"
            else
              user="${DEPLOY_SSH_USER}"
              host="$entry"
            fi

            if [[ -z "$user" || -z "$host" ]]; then
              echo "::warning::Invalid host entry: ${entry}"
              failed=$((failed + 1))
              continue
            fi

            install_dir="/home/${user}/wg-scripts"

            echo "::group::Deploy ${TAG} → ${user}@${host}"
            # GHA runners often cannot resolve MagicDNS short names via system
            # DNS; ask Tailscale's netmap for the 100.x address instead.
            if ! ip="$(tailscale ip -4 "$host")"; then
              echo "::warning::Could not resolve ${host} via Tailscale"
              echo "| \`${host}\` | \`${user}\` | unresolved |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            if ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${user}@${ip}" \
              "bash -lc 'cd ${install_dir} && just deploy ${TAG}'"; then
              echo "OK: ${user}@${host} (${ip})"
              echo "| \`${host}\` | \`${user}\` | OK |" >> "$GITHUB_STEP_SUMMARY"
              ok=$((ok + 1))
            else
              echo "::warning::Failed to deploy ${TAG} to ${user}@${host} (${ip})"
              echo "| \`${host}\` | \`${user}\` | failed |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo ""
            echo "Succeeded: ${ok} / $((ok + failed))"
            echo "Failed: ${failed} / $((ok + failed))"
          } >> "$GITHUB_STEP_SUMMARY"

          # Soft-fail only partial failures: one unreachable Pi must not fail
          # the release deploy. But if every host failed, that is systemic
          # (bad key, Tailscale, missing tag) and must surface.
          if [[ "$ok" -eq 0 && "$failed" -gt 0 ]]; then
            echo "::error::All ${failed} host(s) failed to deploy ${TAG}"
            exit 1
          fi
          exit 0
