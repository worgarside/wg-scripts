# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_language_version = { python = "python3.14" }
default_install_hook_types = [
  "commit-msg",
  "pre-commit"
  ]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  {
    id = "conventional-pre-commit",
    language_version = "python3.14",
    stages = ["commit-msg"]
  }
]

# TODO: worgarside/pre-commit-hooks-dependency-sync only understands
# .pre-commit-config.yaml today, not prek.toml - it will fail here until
# that's fixed upstream. Disabled for now, not removed, as a reminder.
# [[repos]]
# repo = "https://github.com/worgarside/pre-commit-hooks-dependency-sync"
# rev = "1.5.1"
# hooks = [
#   {
#     id = "sync-additional-dependencies",
#     args = ["--package-manager=uv"]
#   }
# ]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.28"
hooks = [
  { id = "uv-lock" }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-added-large-files",
    args = ["--maxkb=1000"]
  },
  { id = "check-case-conflict" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  {
    id = "pretty-format-json",
    args = [
      "--no-sort-keys",
      "--autofix",
      "--indent",
      "2"
    ]
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/jumanjihouse/pre-commit-hook-yamlfmt"
rev = "0.2.3"
hooks = [
  {
    id = "yamlfmt",
    args = [
      "--mapping",
      "2",
      "--sequence",
      "4",
      "--offset",
      "2",
      "--width",
      "4096"
    ]
  }
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint.git"
rev = "v1.38.0"
hooks = [
  {
    id = "yamllint",
    args = [
      "--format",
      "parsable",
      "--strict"
    ]
  }
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" }
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  {
    id = "ruff-check",
    args = ["--fix"]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "https://github.com/DetachHead/basedpyright-prek-mirror"
rev = "1.39.9"
hooks = [
  {
    id = "basedpyright",
    name = "basedpyright-src",
    files = '^(src/|pyproject\.toml$)',
    pass_filenames = false,
    additional_dependencies = [
      "paho-mqtt==2.1.0",
      "pigpio==1.78",
      "psutil==7.2.2",
      "pydantic==2.13.4",
      "requests==2.34.2",
      "wg-utilities==5.17.4"
    ]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  { id = "python-check-blanket-noqa" },
  { id = "python-check-blanket-type-ignore" },
  { id = "python-check-mock-methods" }
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.2"
hooks = [
  {
    id = "codespell",
    additional_dependencies = ["tomli"]
  }
]
