[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_scripts"]

[project]
name = "wg-scripts"
version = "2.0.2"
description = "Raspberry Pi services for MQTT, GPIO, DHT22, and system stats"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "wg-utilities[devices.dht22,exceptions,logging,mqtt]>=5.7.0",
    "psutil",
    "pigpio",
    "dot3k; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.7",
]

[tool.basedpyright]
typeCheckingMode = "all"

include = ["src"]

executionEnvironments = [
  { root = "src" },
]

# pigpio / RPi.GPIO / dot3k are untyped or Pi-only packages
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"
# MQTT helpers return unused status codes; pigpio APIs are untyped
reportUnusedCallResult = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportAny = "none"
reportExplicitAny = "none"
# Darwin stub class vs Linux module share the GPIO name across branches
reportAssignmentType = "none"
reportImplicitStringConcatenation = "none"

pythonVersion = "3.14"

[tool.ruff]
fix = true
preview = true
line-length = 90
lint.select = ["ALL"]
lint.ignore = [
  "CPY",
  "TD002",
  "EM101",
  "EM102",
  "INP001",
  "TRY003",
  "ISC001",
  "ISC003",
  "COM812",
  "DOC201",
  "DOC501",
  "D104",
  "D421",
  "PLR6201",
  "PLW0717",
  "RUF069",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 115

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 15
max-public-methods = 150

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "INP001", "PLC2701", "DOC201", "S108", "S104", "TC002", "SLF001", "PLR2004"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "DeclarativeBase",
  "Base",
  "TypedDict",
]
quote-annotations = true # https://docs.astral.sh/ruff/settings/#lint_flake8-type-checking_quote-annotations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[tool.codespell]
skip = "*.json,*.csv,*.xml,*.txt,*.lock"
ignore-words-list = "homeassistant"

[tool.semantic_release]
tag_format = "{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = [
  "src/wg_scripts/__init__.py:__version__",
]
major_on_zero = false
allow_zero_version = true
build_command = """
    python -m pip install uv
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
  """

[tool.semantic_release.remote]
# Push via the checkout/deploy-key SSH remote instead of embedding GH_TOKEN
# in the git URL (required to bypass the main ruleset without a bot PAT).
ignore_token_for_push = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "deps",
  "docs",
  "hotfix",
  "feat",
  "fix",
  "perf",
  "style",
  "refactor",
  "test",
]
minor_tags = ["feat"]
patch_tags = ["deps", "fix", "hotfix", "perf", "build"]
parse_squash_commits = false
